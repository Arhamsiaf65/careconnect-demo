<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>CareConnect Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: calm marketplace on warm paper; one deep green, soft sage fills, pill controls. Portals reuse the same tokens on a sidebar shell. */
:root{
  --bg:#F8F6F2; --surface:#FFFFFF; --surface-2:#F3F0EA; --surface-3:#EAE6DE; --line:#E8E3DA; --line-strong:#D7D0C4;
  --fg:#1E2421; --fg-2:#424A45; --muted:#737A75;
  --brand:#2D6A53; --brand-hover:#245744; --brand-ink:#FFFFFF; --brand-soft:#E4ECE5; --brand-soft-ink:#265A46;
  --gold:#D9A441; --gold-soft:#F6EEDC; --gold-ink:#7A5714; --on-gold:#2A1C00;
  --good:#2D7A52; --good-soft:#E3EFE6; --warn:#A06A1A; --warn-soft:#F7EDDA; --bad:#B4513E; --bad-soft:#F7E6E1; --info:#3D6E8F; --info-soft:#E4EDF2;
  --hero:#F8F6F2; --hero-fg:#1E2421; --hero-mute:#737A75; --hero-chip:#FFFFFF; --contour:transparent;
  --deep:#24513F; --deep-fg:#F4F8F5; --deep-mute:#B8CFC3;
  --strip:#FFFFFF; --strip-fg:#1E2421; --strip-mute:#737A75; --strip-line:#E8E3DA;
  --av-l:91%; --av-fl:30%; --cv-l1:92%; --cv-l2:89%; --cv-dot:transparent; --on-media:#FFFFFF; --tile-s:22%;
  --scrim:rgba(20,26,22,.45);
  --shadow:0 1px 2px rgba(30,36,33,.04),0 14px 34px -18px rgba(30,36,33,.16);
  --shadow-lg:0 30px 60px -28px rgba(30,36,33,.28);
  --f-display:"Poppins","Segoe UI",system-ui,sans-serif;
  --f-body:"Poppins","Segoe UI",system-ui,-apple-system,sans-serif;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
  --demo-h:46px; color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--strip)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;line-height:1.15;letter-spacing:-.012em;text-wrap:balance;font-weight:700}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}
.ic.fill{fill:currentColor;stroke:none}
.muted{color:var(--muted)} .small{font-size:13px} .min0{min-width:0} .nowrap{white-space:nowrap}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wrap{max-width:1220px;margin:0 auto;padding-left:var(--gl);padding-right:var(--gr)}
@media (min-width:900px){.wrap{padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}}
.tnum{font-variant-numeric:tabular-nums}

/* Demo bar */
.demo-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--strip);color:var(--strip-fg);border-bottom:1px solid var(--strip-line)}
.demo-row{display:flex;align-items:center;gap:14px;min-height:var(--demo-h);padding-block:6px;padding-left:var(--gl);padding-right:var(--gr)}
.demo-tag{display:flex;align-items:center;gap:9px;font-size:12.5px;white-space:nowrap;color:var(--strip-mute)}
.demo-tag b{color:var(--strip-fg);font-weight:600}
.demo-dot{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px rgba(227,165,31,.2)}
.seg{display:flex;gap:2px;background:var(--strip-line);padding:3px;border-radius:10px;overflow-x:auto;scrollbar-width:none;min-width:0}
.seg::-webkit-scrollbar{display:none}
.seg button{padding:6px 12px;border-radius:7px;font-size:13px;font-weight:600;color:var(--strip-mute);white-space:nowrap;display:flex;align-items:center;gap:6px}
.seg button:hover{color:var(--strip-fg)}
.seg button.on{background:var(--strip-fg);color:var(--strip)}
.demo-tools{margin-left:auto;display:flex;gap:6px;align-items:center}
.demo-tool{height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--strip-line);font-size:12.5px;font-weight:600;color:var(--strip-fg);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.demo-tool:hover{background:var(--strip-line)}

/* Site header */
.site-head{background:var(--surface);border-bottom:1px solid var(--line);position:relative;z-index:30}
.head-row{display:flex;align-items:center;gap:28px;height:68px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:500;font-size:20px;letter-spacing:-.02em;white-space:nowrap}
.logo b{font-weight:800;color:var(--brand)}
.logo svg{width:32px;height:32px;flex:none}
.site-nav{display:flex;gap:2px}
.site-nav a{padding:8px 12px;border-radius:8px;font-weight:500;color:var(--fg-2)}
.site-nav a:hover{background:var(--surface-2)}
.site-nav a.on{color:var(--brand-soft-ink);background:var(--brand-soft)}
.head-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.show-sm{display:none!important}

/* Buttons & primitives */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:10px;font-weight:600;font-size:14.5px;border:1px solid transparent;transition:background .15s,border-color .15s,transform .1s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--brand);color:var(--brand-ink)} .btn-primary:hover{background:var(--brand-hover)}
.btn-ghost{background:var(--surface);border-color:var(--line-strong);color:var(--fg)} .btn-ghost:hover{background:var(--surface-2)}
.btn-soft{background:var(--brand-soft);color:var(--brand-soft-ink)}
.btn-gold{background:var(--gold);color:var(--on-gold)} .btn-gold:hover{filter:brightness(1.05)}
.btn-danger{background:var(--bad-soft);color:var(--bad)}
.btn-sm{height:34px;padding:0 12px;font-size:13.5px;border-radius:8px}
.btn-lg{height:52px;padding:0 24px;font-size:16px;border-radius:12px}
.btn-block{width:100%}
.icon-btn{width:38px;height:38px;border-radius:10px;display:inline-grid;place-items:center;border:1px solid var(--line);background:var(--surface);position:relative}
.icon-btn .dot{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--bad);border:2px solid var(--surface)}
.av{--sz:40px;width:var(--sz);height:var(--sz);border-radius:50%;display:inline-grid;place-items:center;background:hsl(var(--h) 45% var(--av-l));color:hsl(var(--h) 55% var(--av-fl));font-weight:700;font-size:calc(var(--sz)*.37);flex:none;font-family:var(--f-display);letter-spacing:0}
.av-sm{--sz:30px} .av-md{--sz:46px} .av-lg{--sz:64px}
.av-logo{--sz:58px;border-radius:15px;border:3px solid var(--surface)}
.av-xl{--sz:116px;border-radius:26px;border:4px solid var(--surface);box-shadow:var(--shadow)}
.av-round-xl{--sz:116px;border:4px solid var(--surface);box-shadow:var(--shadow)}
.cover{background:linear-gradient(135deg,hsl(var(--h) 42% var(--cv-l1)),hsl(calc(var(--h) + 38) 46% var(--cv-l2)));position:relative;overflow:hidden}
.cover::after{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--cv-dot) 1.2px,transparent 1.5px);background-size:14px 14px;pointer-events:none}
.stars{position:relative;display:inline-flex;vertical-align:middle;line-height:0}
.stars .s-row{display:flex;gap:1px}
.stars svg{width:14px;height:14px;flex:none}
.stars .s-bg svg{fill:var(--line-strong)}
.stars .s-fg{position:absolute;inset:0 auto 0 0;overflow:hidden}
.stars .s-fg svg{fill:var(--gold)}
.stars.lg svg{width:20px;height:20px}
.badge-ver{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--good);background:var(--good-soft);padding:2px 9px 2px 7px;border-radius:999px;white-space:nowrap}
.badge-feat{display:inline-flex;align-items:center;gap:4px;background:var(--gold);color:var(--on-gold);font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.02em;white-space:nowrap}
.cover .badge-feat{position:absolute;top:10px;right:10px;z-index:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--fg-2);border:1px solid var(--line);white-space:nowrap}
button.chip{cursor:pointer} button.chip.on{background:var(--brand-soft);color:var(--brand-soft-ink);border-color:var(--brand)}
.req{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;letter-spacing:.02em;color:var(--info);background:var(--info-soft);padding:2px 8px 2px 6px;border-radius:999px;vertical-align:middle;white-space:nowrap;font-family:var(--f-body)}
body.hide-req .req{display:none}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap;background:var(--surface-3);color:var(--fg-2)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--info-soft);color:var(--info)} .pill.gold{background:var(--gold-soft);color:var(--gold-ink)}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--brand)}
.panel,.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;min-width:0}
.panel{padding:24px} .card{padding:20px}
.panel>h3,.card-head h3{font-size:18px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.card-head h3{font-size:16.5px}
.link{color:var(--brand);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:4px}
.link:hover{text-decoration:underline}
.sw-btn{width:40px;height:23px;border-radius:99px;background:var(--line-strong);position:relative;transition:background .15s;flex:none}
.sw-btn::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:var(--surface);transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw-btn.on{background:var(--brand)} .sw-btn.on::after{transform:translateX(17px)}
.divider{height:1px;background:var(--line);border:0;margin:0}
</style>
<style>
/* Hero */
.hero{background:var(--hero);color:var(--hero-fg);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 86% 6%,transparent 0 26px,var(--contour) 26px 27.5px);pointer-events:none}
.hero-grid{position:relative;display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr);gap:56px;padding-block:68px 76px;align-items:center}
.hero .eyebrow{color:var(--gold)}
.hero h1{font-size:clamp(34px,4.7vw,60px);font-weight:750;letter-spacing:-.028em;margin-top:16px;line-height:1.04}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero .lede{margin-top:18px;font-size:18px;color:var(--hero-mute);max-width:52ch}
.searchbox{margin-top:30px;background:var(--surface);color:var(--fg);border-radius:16px;padding:8px;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr) auto;gap:6px;box-shadow:var(--shadow-lg)}
.sb-field{display:flex;flex-direction:column;padding:7px 14px;border-radius:10px;min-width:0}
.sb-field:hover{background:var(--surface-2)}
.sb-field label{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:flex;gap:6px;align-items:center}
.sb-field select{border:0;background:transparent;padding:2px 0;font-weight:600;font-size:15px;outline:none;width:100%;min-width:0;text-overflow:ellipsis}
.searchbox .btn{height:auto;min-height:52px}
.hero-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:center;font-size:13px;color:var(--hero-mute)}
.hero-chips button{background:var(--hero-chip);color:var(--hero-fg);padding:5px 12px;border-radius:999px;font-size:13px;font-weight:500}
.hero-chips button:hover{background:rgba(255,255,255,.16)}
.hero-stats{display:flex;gap:34px;margin-top:34px;flex-wrap:wrap}
.hero-stats b{font-family:var(--f-display);font-size:28px;font-weight:700;display:block;line-height:1.1}
.hero-stats span{color:var(--hero-mute);font-size:13px}
.hero-visual{display:flex;flex-direction:column;gap:14px}
.float-card{background:var(--surface);color:var(--fg);border-radius:18px;box-shadow:var(--shadow-lg);padding:16px 18px}
.fc-1{margin-right:56px} .fc-2{margin-left:64px;display:flex;gap:12px;align-items:center} .fc-3{margin-right:20px;margin-left:24px}
.fc-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-soft-ink);flex:none}

/* Sections */
.section{padding-block:64px}
.section.alt{background:var(--surface-2);border-block:1px solid var(--line)}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:26px;flex-wrap:wrap}
.sec-head h2{font-size:clamp(25px,3vw,36px);letter-spacing:-.02em;margin-top:8px}
.sec-head p{color:var(--muted);margin-top:8px;max-width:62ch}
.svc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:10px}
.svc-grid:not(.expanded) .more{display:none}
.svc-tile{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;text-align:left;font-weight:600;font-size:14px;line-height:1.3;transition:border-color .15s,transform .15s,box-shadow .15s;min-width:0}
.svc-tile:hover{border-color:var(--brand);transform:translateY(-1px);box-shadow:var(--shadow)}
.svc-ic{width:38px;height:38px;border-radius:10px;background:var(--brand-soft);color:var(--brand-soft-ink);display:grid;place-items:center;flex:none}
.svc-tile .tag{display:block;font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.03em;margin-bottom:1px}
.ad{border:1px solid var(--line);border-radius:16px;background:linear-gradient(110deg,var(--info-soft),var(--surface) 70%);display:flex;align-items:center;gap:20px;padding:18px 22px;flex-wrap:wrap}
.ad-art{width:64px;height:64px;border-radius:14px;display:grid;place-items:center;background:var(--info);color:var(--surface);flex:none}
.ad-art .ic{width:30px;height:30px}
.ad-label{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted);border:1px solid var(--line-strong);border-radius:4px;padding:1px 6px}
.ad h4{font-size:17px} .ad p{color:var(--muted);font-size:14px}
.ad-body{flex:1;min-width:220px;display:flex;flex-direction:column;gap:4px}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:18px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .2s,transform .2s}
.pcard:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.pcard.is-featured{border-color:var(--gold)}
.pcard-cover{height:86px}
.pcard-body{padding:0 18px 18px;display:flex;flex-direction:column;gap:12px;flex:1}
.pcard-head{display:flex;flex-direction:column;gap:10px;align-items:flex-start;margin-top:-30px;position:relative;z-index:1}
.pcard h3{font-size:17px;line-height:1.25}
.pcard h3 a:hover{color:var(--brand)}
.meta{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:13px}
.rating-row{display:flex;align-items:center;gap:6px;font-size:13.5px;flex-wrap:wrap}
.pcard-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:12px;border-top:1px solid var(--line);flex-wrap:wrap}
.how{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.how-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:30px;display:flex;flex-direction:column;gap:20px}
.how-card h3{font-size:22px}
.how-steps{display:flex;flex-direction:column;gap:16px;counter-reset:s}
.how-steps li{display:grid;grid-template-columns:36px 1fr;gap:14px;counter-increment:s}
.how-steps li::before{content:counter(s);width:36px;height:36px;border-radius:50%;background:var(--brand-soft);color:var(--brand-soft-ink);display:grid;place-items:center;font-weight:700;font-family:var(--f-display)}
.how-steps b{display:block} .how-steps span{color:var(--muted);font-size:14px}
.cg-band{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:40px;align-items:center}
.cg-mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.cg-mini .card{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:18px 12px}
.res-band{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px}
.fb-card{background:var(--hero);color:var(--hero-fg);border-radius:20px;padding:30px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.fb-card::before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 100% 100%,transparent 0 22px,var(--contour) 22px 23.5px);pointer-events:none}
.fb-card>*{position:relative} .fb-card p{color:var(--hero-mute)}
.res-list{display:flex;flex-direction:column;gap:10px}
.res-item{display:flex;gap:14px;align-items:center;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;text-align:left;width:100%}
.res-item:hover{border-color:var(--brand)}
.res-thumb{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;color:var(--on-media);flex:none}
.cta-band{background:var(--brand);color:var(--brand-ink);border-radius:24px;padding:40px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
.cta-band h2{font-size:clamp(24px,3vw,34px)}
.cta-band p{opacity:.85;margin-top:6px;max-width:56ch}
.cta-band .btn-ghost{background:var(--brand-ink);color:var(--brand);border-color:transparent}
.site-foot{background:var(--surface);border-top:1px solid var(--line);padding-block:44px 30px;margin-top:64px}
.foot-grid{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:28px}
.foot-grid h4{font-size:13px;font-family:var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.foot-grid a{display:block;padding:3px 0;color:var(--fg-2);font-size:14px} .foot-grid a:hover{color:var(--brand)}
.foot-base{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}

/* Search */
.page-head{background:var(--surface);border-bottom:1px solid var(--line);padding-block:26px}
.page-head h1{font-size:clamp(24px,3vw,34px);letter-spacing:-.02em}
.page-head p{color:var(--muted);margin-top:6px}
.searchbar{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:10px;margin-top:18px}
.search-layout{display:grid;grid-template-columns:262px minmax(0,1fr) 250px;gap:24px;padding-block:26px 40px;align-items:start}
.filters{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:20px;position:sticky;top:calc(var(--demo-h) + 16px)}
.f-group h4{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-family:var(--f-body);font-weight:700;margin-bottom:8px}
.radio-list{display:flex;flex-direction:column;gap:2px}
.radio-list label,.check{display:flex;gap:10px;align-items:center;padding:5px 0;cursor:pointer;font-size:14px}
input[type=checkbox],input[type=radio]{accent-color:var(--brand);width:17px;height:17px;margin:0;flex:none}
.results{display:flex;flex-direction:column;gap:14px;min-width:0}
.res-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.res-bar select{width:auto}
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:18px;transition:box-shadow .2s}
.prow:hover{box-shadow:var(--shadow)}
.prow.is-featured{border-color:var(--gold);background:linear-gradient(180deg,var(--gold-soft),var(--surface) 58%)}
.prow .av-logo{border:0}
.prow h3{font-size:18px} .prow h3 a:hover{color:var(--brand)}
.prow-main{display:flex;flex-direction:column;gap:8px;min-width:0}
.prow-main p{color:var(--fg-2);font-size:14px}
.prow-side{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:10px;text-align:right}
.rank{font-size:12px;font-weight:700;color:var(--brand-soft-ink);background:var(--brand-soft);padding:2px 9px;border-radius:999px;white-space:nowrap}
.ad-side{display:flex;flex-direction:column;gap:14px;position:sticky;top:calc(var(--demo-h) + 16px)}
.ad-tall{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface)}
.ad-tall .cover{height:120px;display:grid;place-items:center;color:var(--on-media)}
.ad-tall .cover .ic{width:40px;height:40px;position:relative;z-index:1}
.ad-tall-body{padding:16px;display:flex;flex-direction:column;gap:8px}
.ad-slot-empty{border:1.5px dashed var(--line-strong);border-radius:16px;padding:18px;text-align:center;color:var(--muted);font-size:13.5px;display:flex;flex-direction:column;gap:8px;align-items:center}
.inline-ad{display:none}
.empty{padding:36px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}

/* Profile */
.prof-cover{height:210px}
.prof-head{display:flex;gap:22px;align-items:flex-end;margin-top:-52px;position:relative;z-index:1;flex-wrap:wrap}
.prof-title{flex:1;min-width:240px;display:flex;flex-direction:column;gap:8px;padding-bottom:4px}
.prof-title h1{font-size:clamp(26px,3.2vw,38px);letter-spacing:-.02em}
.prof-actions{display:flex;gap:8px;padding-bottom:6px;flex-wrap:wrap}
.prof-layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:28px;padding-block:28px 24px;align-items:start}
.prof-main{display:flex;flex-direction:column;gap:20px;min-width:0}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.fact{background:var(--surface);padding:14px 16px}
.fact b{display:block;font-family:var(--f-display);font-size:21px}
.fact span{font-size:12.5px;color:var(--muted)}
.svc-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.svc-li{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:14px;font-weight:500}
.svc-li .ic{color:var(--brand)}
.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.g-tile{aspect-ratio:4/3;border-radius:12px;display:grid;place-items:center;color:var(--on-media);max-width:100%}
.g-tile .ic{width:26px;height:26px;position:relative;z-index:1;opacity:.85}
.rv-sum{display:grid;grid-template-columns:190px minmax(0,1fr);gap:28px;align-items:center}
.rv-big{font-family:var(--f-display);font-size:60px;font-weight:750;line-height:1;letter-spacing:-.03em}
.hist{display:flex;flex-direction:column;gap:6px}
.hist-row{display:grid;grid-template-columns:52px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:13px;color:var(--fg-2)}
.hist-bar{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.hist-bar i{display:block;height:100%;background:var(--gold);border-radius:inherit}
.rv-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:22px 0 4px}
.fchip{padding:6px 13px;border-radius:999px;border:1px solid var(--line-strong);font-size:13px;font-weight:600;background:var(--surface);display:inline-flex;gap:6px;align-items:center}
.fchip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.review{padding:20px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.rv-head{display:flex;gap:12px;align-items:center}
.rv-head .who{display:flex;flex-direction:column;min-width:0}
.rv-head .when{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.review h4{font-size:16px;font-family:var(--f-body);font-weight:700}
.review p{color:var(--fg-2);font-size:14.5px;max-width:72ch}
.rv-media{display:flex;gap:8px;flex-wrap:wrap}
.media{width:104px;height:78px;border-radius:10px;position:relative;overflow:hidden;display:grid;place-items:center;color:var(--on-media);flex:none}
.media img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.media .ic{width:24px;height:24px;position:relative;z-index:1}
.media .dur{position:absolute;right:6px;bottom:5px;z-index:2;font-size:11px;background:rgba(0,0,0,.6);color:#fff;padding:1px 6px;border-radius:4px;font-weight:600}
.media .rm{position:absolute;top:4px;right:4px;z-index:2;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.rv-foot{display:flex;gap:14px;align-items:center;font-size:13px;color:var(--muted);flex-wrap:wrap}
.rv-foot button{display:inline-flex;gap:5px;align-items:center;font-weight:600;color:var(--fg-2)}
.reply{background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:14px;margin-left:52px;display:flex;flex-direction:column;gap:4px}
.reply b{font-size:13px}
.side-sticky{position:sticky;top:calc(var(--demo-h) + 16px);display:flex;flex-direction:column;gap:16px}
.contact-mask{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border:1px dashed var(--line-strong);border-radius:12px;font-size:14px}
.blur{filter:blur(4px);user-select:none}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.label{font-size:13px;font-weight:600;color:var(--fg-2)}
.input{height:44px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);padding:0 12px;width:100%;min-width:0;outline:none;transition:border-color .15s,box-shadow .15s}
textarea.input{height:auto;padding:10px 12px;resize:vertical;min-height:96px;line-height:1.5}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.span2{grid-column:1/-1}
.err{color:var(--bad);font-size:13px;font-weight:600}
.hint{font-size:12.5px;color:var(--muted)}
.picker{display:inline-flex;gap:2px}
.picker button svg{width:36px;height:36px;fill:var(--line-strong);transition:fill .1s,transform .1s}
.picker button.on svg{fill:var(--gold)}
.picker:hover button svg{fill:var(--gold)}
.picker button:hover~button svg{fill:var(--line-strong)}
.picker button:hover svg{transform:scale(1.1)}
.picker-label{font-weight:600;color:var(--muted);font-size:14px}
.drop{border:1.5px dashed var(--line-strong);border-radius:12px;padding:16px;display:flex;gap:14px;align-items:center;background:var(--surface-2);cursor:pointer;position:relative}
.drop:hover{border-color:var(--brand)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.drop-ic{width:44px;height:44px;border-radius:12px;background:var(--surface);display:grid;place-items:center;color:var(--brand);flex:none;border:1px solid var(--line)}
.opt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.opt{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;font-weight:600;font-size:14px;line-height:1.3;transition:border-color .15s}
.opt:hover{border-color:var(--line-strong)}
.opt.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-soft-ink)}
.opt-scroll{max-height:310px;overflow:auto;padding-right:4px}
.role-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface-2);padding:4px;border-radius:12px}
.role-tabs button{padding:9px 8px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.role-tabs button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}

/* Modal & toast */
.modal-back{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(3px);z-index:80;display:grid;place-items:center;padding:20px var(--gr) 20px var(--gl);animation:fade .15s}
.modal{background:var(--surface);border-radius:22px;width:min(580px,100%);max-height:calc(100dvh - 40px);overflow:auto;box-shadow:var(--shadow-lg);animation:pop .2s ease-out;display:flex;flex-direction:column}
.modal.wide{width:min(780px,100%)}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:22px 24px 0}
.modal-head h3{font-size:22px} .modal-head p{color:var(--muted);font-size:14px;margin-top:4px}
.modal-body{padding:18px 24px 22px;display:flex;flex-direction:column;gap:16px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 24px;border-top:1px solid var(--line);background:var(--surface-2);position:sticky;bottom:0;flex-wrap:wrap}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:95;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:calc(100% - 32px)}
.toast{background:var(--fg);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:500;font-size:14px;box-shadow:var(--shadow-lg);display:flex;gap:10px;align-items:center;animation:up .22s ease-out}
.toast .ic{color:var(--brand)}
@keyframes fade{from{opacity:0}} @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}} @keyframes up{from{opacity:0;transform:translateY(8px)}}
.install{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:12px var(--gr) calc(12px + env(safe-area-inset-bottom,0px)) var(--gl);background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -12px 30px -12px rgba(0,0,0,.25);display:none;align-items:center;gap:12px}

/* Wizard & timeline */
.wiz{max-width:820px;margin:0 auto;padding-block:32px 24px;display:flex;flex-direction:column;gap:22px}
.steps{display:flex;gap:10px}
.step{flex:1;display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:600;color:var(--muted)}
.step i{height:5px;border-radius:99px;background:var(--surface-3)}
.step.on{color:var(--fg)} .step.on i{background:var(--brand)}
.tl{display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:30px 1fr;gap:12px;padding-bottom:18px;position:relative}
.tl li::before{content:"";position:absolute;left:14px;top:30px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child{padding-bottom:0} .tl li:last-child::before{display:none}
.tl-dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface-3);color:var(--muted)}
.tl-dot.done{background:var(--brand);color:var(--brand-ink)} .tl-dot.now{background:var(--brand-soft);color:var(--brand-soft-ink)}
.tl b{display:block;font-size:14.5px} .tl span{color:var(--muted);font-size:13.5px}
.success-ic{width:64px;height:64px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center}
.success-ic .ic{width:32px;height:32px;stroke-width:2.4}

/* Pricing */
.toggle-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:26px}
.mini-seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.mini-seg button{padding:6px 14px;border-radius:7px;font-weight:600;font-size:13.5px;color:var(--muted)}
.mini-seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:stretch}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px;display:flex;flex-direction:column;gap:18px;position:relative}
.plan.pop{border:2px solid var(--brand);box-shadow:var(--shadow)}
.plan .pop-tag{position:absolute;top:-13px;left:28px;background:var(--brand);color:var(--brand-ink);font-size:12px;font-weight:700;padding:4px 12px;border-radius:999px}
.plan h3{font-size:21px}
.plan-price{font-family:var(--f-display);font-size:44px;font-weight:750;letter-spacing:-.03em;line-height:1}
.plan-price small{font-size:15px;font-family:var(--f-body);color:var(--muted);font-weight:500;letter-spacing:0}
.plan ul{display:flex;flex-direction:column;gap:10px;font-size:14.5px}
.plan li{display:flex;gap:10px;align-items:flex-start}
.plan li .ic{color:var(--brand);margin-top:2px}
.plan li.no{color:var(--muted)} .plan li.no .ic{color:var(--line-strong)}
.plan .btn{margin-top:auto}
.addons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.addon{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:8px}
.addon .fc-ic{margin-bottom:4px}
.addon b.price{font-family:var(--f-display);font-size:22px}
.note{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;background:var(--brand-soft);color:var(--brand-soft-ink);font-size:14.5px}
.faq{display:flex;flex-direction:column;gap:8px;max-width:820px}
.faq details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px}
.faq summary{font-weight:600;cursor:pointer}
.faq details p{color:var(--fg-2);margin-top:8px;font-size:14.5px}

/* Resources & caregivers */
.res-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.res-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.res-card .cover{height:130px;display:grid;place-items:center;color:var(--on-media)}
.res-card .cover .ic{width:40px;height:40px;position:relative;z-index:1}
.res-card-body{padding:18px;display:flex;flex-direction:column;gap:10px;flex:1}
.res-card-body h3{font-size:17px;line-height:1.3}
.res-card-body .btn{margin-top:auto;align-self:flex-start}
.cg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.cg-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px;transition:box-shadow .2s}
.cg-card:hover{box-shadow:var(--shadow)}
.cg-top{display:flex;gap:14px;align-items:center}
.cg-top h3{font-size:17px}
.checks{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.checks span{display:flex;gap:8px;align-items:center} .checks .ic{color:var(--good)}
.rate{font-family:var(--f-display);font-weight:700;font-size:18px}
.rate small{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:500}
.avail{display:grid;grid-template-columns:78px repeat(7,minmax(0,1fr));gap:4px;font-size:12px;align-items:center}
.avail .h{text-align:center;color:var(--muted);font-weight:600}
.avail .cell{height:28px;border-radius:7px;background:var(--surface-3)}
.avail .cell.on{background:var(--brand)}
.avail button.cell{cursor:pointer} .avail button.cell:hover{outline:2px solid var(--brand-soft)}
.match-pct{font-family:var(--f-display);font-weight:750;font-size:22px;color:var(--brand)}

/* Portal shell */
.portal{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:calc(100dvh - var(--demo-h))}
.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:3px;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--demo-h));height:calc(100dvh - var(--demo-h));overflow:auto}
.side-brand{padding:2px 10px 14px}
.side-org{display:flex;gap:10px;align-items:center;padding:10px;margin-bottom:6px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.side-org b{display:block;font-size:13.5px;line-height:1.25} .side-org span{font-size:12px;color:var(--muted)}
.side-role{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:14px 10px 6px}
.side a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--fg-2);font-weight:500;font-size:14.5px}
.side a:hover{background:var(--surface-2)}
.side a.on{background:var(--brand-soft);color:var(--brand-soft-ink);font-weight:600}
.side a .count{margin-left:auto;font-size:11.5px;background:var(--surface-3);padding:0 7px;border-radius:99px;font-weight:700;line-height:20px}
.side a.on .count{background:var(--brand);color:var(--brand-ink)}
.side a .count.hot{background:var(--bad);color:var(--surface)}
.side-user{margin-top:auto;display:flex;gap:10px;align-items:center;padding:14px 10px 2px;border-top:1px solid var(--line)}
.side-user b{display:block;font-size:13.5px} .side-user span{font-size:12px;color:var(--muted)}
.main{padding:28px max(32px,env(safe-area-inset-right,0px)) 56px 32px;min-width:0;display:flex;flex-direction:column;gap:22px}
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.topbar h1{font-size:28px;letter-spacing:-.02em} .topbar p{color:var(--muted);margin-top:2px}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search-in{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--muted);width:240px;max-width:100%}
.search-in input{border:0;background:transparent;outline:none;width:100%;min-width:0;color:var(--fg)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi-label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi-val{font-family:var(--f-display);font-size:29px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.delta{font-size:12.5px;font-weight:600;color:var(--good);display:inline-flex;gap:4px;align-items:center}
.delta.down{color:var(--bad)} .delta span{color:var(--muted);font-weight:500}
.kpi.hl{background:var(--hero);color:var(--hero-fg);border-color:transparent;position:relative;overflow:hidden}
.kpi.hl::before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 100% 0,transparent 0 16px,var(--contour) 16px 17px);pointer-events:none}
.kpi.hl>*{position:relative} .kpi.hl .kpi-label,.kpi.hl .delta span{color:var(--hero-mute)} .kpi.hl .delta{color:var(--gold)}
.grid-2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
.grid-2e{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.card .tbl-wrap{border:0;border-radius:0;margin:0 -20px -20px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:760px}
th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:11px 16px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
.cell-user{display:flex;gap:10px;align-items:center;min-width:0}
.cell-user b{display:block;font-weight:600;line-height:1.3} .cell-user span{font-size:12.5px;color:var(--muted)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:12.5px;color:var(--muted)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}

function dist(r){const p5=Math.round(Math.min(94,Math.max(40,(r-3.6)*72)));const rest=100-p5;const p4=Math.round(rest*.62),p3=Math.round((rest-p4)*.6),p2=Math.round((rest-p4-p3)*.6);return [p5,p4,p3,p2,Math.max(0,100-p5-p4-p3-p2)]}

 openModal(`${mHead('Review '+esc(obj.name),'Your review helps other families choose with confidence.')}<form data-form="review"><div class="modal-body">
  <div class="field"><span class="label">Your rating ${REQ('1–5 stars')}</span><div class="row"><div class="picker" id="picker">${[1,2,3,4,5].map(v=>`<button type="button" class="${v<=state.rv.rating?'on':''}" data-act="pick" data-v="${v}" aria-label="${v} stars"><svg viewBox="0 0 24 24"><path d="${STAR}"/></svg></button>`).join('')}</div><span class="picker-label" id="pick-label">${labels[state.rv.rating]||'Tap to rate'}</span></div></div>
  ${kind==='p'?`<div class="field"><label for="rv-svc">Service you used</label><select class="input" id="rv-svc">${obj.services.map(s=>`<option value="${esc(s)}">${fs(s)}</option>`).join('')}</select></div>`:''}
  <div class="field"><label for="rv-title">Headline</label><input class="input" id="rv-title" placeholder="Sum up your experience" value="${pre?'Reliable, kind and always on time':''}"></div>
  <div class="field"><label for="rv-text">Your review</label><textarea class="input" id="rv-text" placeholder="What went well? What could be better?">${pre?'Our caregiver followed the routine exactly and kept us updated after every visit. We finally had time to rest.':''}</textarea></div>
  <div class="field"><span class="label">Add photos or video ${REQ()}</span><label class="drop"><input type="file" accept="image/*,video/*" multiple id="rv-files" aria-label="Add photos or video"><span class="drop-ic">${ic('upload')}</span><span><b>Upload photos or a short video</b><span class="hint" style="display:block">JPG, PNG or MP4 up to 50 MB. Faces of others are blurred on request.</span></span></label><div class="previews rv-media" id="previews">${previews()}</div></div>
  <label class="check"><input type="checkbox" id="rv-rec" checked> I would recommend them to other families</label>
  <div class="err" id="rv-err" hidden>Choose a star rating before posting.</div></div>
  <div class="modal-foot"><button type="button" class="btn btn-ghost" data-act="close-modal">Cancel</button><button class="btn btn-primary">Post review</button></div></form>`)}
const previews=()=>state.draft.map((m,i)=>media(m,`data-i="${i}"`).replace('</span>',`</span>`).replace(/<\/span>$/,`<button type="button" class="rm" data-act="rm-media" data-i="${i}" aria-label="Remove">${ic('x')}</button></span>`)).join('');

function openMatch(cgId,demo){
 const needs=['Dementia care','Mobility & transfers','Autism support','Personal care','Medication reminders','Wound care','Feeding support','Youth respite'];
 openModal(`${mHead('Get matched with a caregiver','Tell us about the person who needs care. We’ll suggest the best caregivers.')}<form data-form="match"><div class="modal-body">
  <div class="form-grid"><div class="field"><label for="mt-who">Who needs care?</label><select class="input" id="mt-who"><option>My parent</option><option>My child</option><option>Myself</option><option>Another family member</option></select></div><div class="field"><label for="mt-par">Parish</label><select class="input" id="mt-par">${parishOptions('St. Andrew')}</select></div></div>
  <div class="field"><span class="label">Care needs</span><div class="chips">${needs.map((n,i)=>`<button type="button" class="chip ${i<2||demo&&i===4?'on':''}" data-act="chip">${n}</button>`).join('')}</div></div>
  <div class="field"><span class="label">Schedule</span><div class="chips">${['Live-in','Hourly','Overnight','Weekends'].map((n,i)=>`<button type="button" class="chip ${i===0?'on':''}" data-act="chip">${n}</button>`).join('')}</div></div>
  <div id="match-out" ${demo?'':'hidden'}>${matchOut()}</div></div>
  <div class="modal-foot"><button type="button" class="btn btn-ghost" data-act="close-modal">Close</button><button class="btn btn-primary">${ic('heart')} Show my matches</button></div></form>`)}
function matchOut(){const pct=[96,91,87];const top=[CAREGIVERS[0],CAREGIVERS[4],CAREGIVERS[5]];return `<div class="note" style="margin-bottom:10px">${ic('check')}<span>Top 3 matches for live-in dementia care in St. Andrew. We’ve sent them your request.</span></div>${top.map((c,i)=>`<div class="list-row">${av(c.name,c.hue,'av-md')}<div class="grow"><b>${c.name}</b><span class="sub">${c.role} · ${c.parish} · ${jm(c.rate)}/hr · ${stars(c.rating)} ${c.rating.toFixed(1)}</span></div><div style="text-align:right"><div class="match-pct">${pct[i]}%</div><span class="small muted">match</span></div></div>`).join('')}`}

function openProvReview(id){const p=PENDING.find(x=>x.id===id);if(!p)return;
 openModal(`${mHead('Review application','Check the documents, then approve or reject.')}<div class="modal-body">
  <div class="row" style="flex-wrap:nowrap;gap:14px">${av(p.name,p.hue,'av-lg')}<div><h3 style="font-size:20px">${p.name}</h3><span class="small muted">${p.contact} · ${p.parish} · ${p.plan} plan · applied ${p.submitted}</span></div></div>
  <div class="chips">${p.services.map(s=>`<span class="chip">${fs(s)}</span>`).join('')}</div>
  <div class="doc-list">${Object.entries(p.docs).map(([d,ok])=>`<div class="doc"><span class="doc-ic">${ic('file')}</span><div style="flex:1;min-width:0"><b class="small">${d}</b><div class="small muted">${ok?'Uploaded · PDF':'Not uploaded yet'}</div></div>${ok?`<button class="btn btn-ghost btn-sm" data-toast="Document preview opens here.">${ic('eye')} View</button>`:'<span class="pill warn">Missing</span>'}</div>`).join('')}</div>
  ${Object.values(p.docs).every(Boolean)?'':`<div class="note" style="background:var(--warn-soft);color:var(--warn)">${ic('flag')}<span>One document is missing. You can ask for it now, or approve and give them 7 days to upload it.</span></div>`}
  <div class="field"><label for="ap-note">Message to provider (optional)</label><textarea class="input" id="ap-note" style="min-height:70px" placeholder="Welcome to CareConnect!"></textarea></div></div>
  <div class="modal-foot"><button class="btn btn-danger" data-act="decide" data-id="${p.id}" data-v="Rejected">Reject</button><button class="btn btn-ghost" data-act="decide" data-id="${p.id}" data-v="ask">Ask for documents</button><button class="btn btn-primary" data-act="decide" data-id="${p.id}" data-v="Active">${ic('check')} Approve & publish</button></div>`)}

function openLead(id){const l=LEADS.find(x=>x.id===id);state.leadStatus[id]=state.leadStatus[id]&&state.leadStatus[id]!=='New'?state.leadStatus[id]:'Contacted';
 openModal(`${mHead(`${l.who} · ${fs(l.svc)}`,`${l.id} · received ${l.when}`)}<div class="modal-body">
  <div class="note">${ic('check')}<span>Included in your Premium plan. No credits or extra fees.</span></div>
  <div class="form-grid"><div class="field"><span class="label">For</span><b>${l.for}</b></div><div class="field"><span class="label">Location</span><b>${l.town}, ${l.parish}</b></div><div class="field"><span class="label">Needs</span><b>${l.need}</b></div><div class="field"><span class="label">Prefers</span><b>WhatsApp</b></div></div>
  <div class="contact-mask" style="border-style:solid"><span class="row">${ic('phone')}<b class="mono" style="color:var(--fg)">${l.phone}</b></span><button class="btn btn-soft btn-sm" data-act="copy" data-v="${l.phone}">Copy</button></div>
  <div class="contact-mask" style="border-style:solid"><span class="row">${ic('mail')}<b class="mono" style="color:var(--fg)">${l.email}</b></span><button class="btn btn-soft btn-sm" data-act="copy" data-v="${l.email}">Copy</button></div>
  <div class="field"><label for="ld-st">Update status</label><select class="input" id="ld-st" data-act="lead-status" data-id="${l.id}">${['New','Contacted','Won','Closed'].map(s=>`<option ${sel(s,state.leadStatus[id])}>${s}</option>`).join('')}</select></div></div>
  <div class="modal-foot"><button class="btn btn-primary" data-act="close-modal">Done</button></div>`)}

function openRateClient(name,k){state.rv={target:'client',rating:0,k};openModal(`${mHead('Rate '+esc(name),'Only the average is shown to families. Other caregivers see your comments.')}<form data-form="rate-client"><div class="modal-body"><div class="field"><span class="label">Rating ${REQ('Caregiver reviews client')}</span><div class="row"><div class="picker" id="picker">${[1,2,3,4,5].map(v=>`<button type="button" data-act="pick" data-v="${v}" aria-label="${v} stars"><svg viewBox="0 0 24 24"><path d="${STAR}"/></svg></button>`).join('')}</div><span class="picker-label" id="pick-label">Tap to rate</span></div></div><div class="field"><label for="rc-text">Comments</label><textarea class="input" id="rc-text" placeholder="Was the family respectful, clear and on time with payment?"></textarea></div><div class="err" id="rv-err" hidden>Choose a star rating first.</div></div><div class="modal-foot"><button type="button" class="btn btn-ghost" data-act="close-modal">Cancel</button><button class="btn btn-primary">Submit review</button></div></form>`)}

function openResource(i){const r=RESOURCES[i];openModal(`${mHead('Get it free',esc(r.t))}<form data-form="resource"><div class="modal-body"><div class="form-grid"><div class="field"><label for="rs-name">First name</label><input class="input" id="rs-name" required></div><div class="field"><label for="rs-email">Email</label><input class="input" id="rs-email" type="email" required></div><div class="field"><label for="rs-par">Parish</label><select class="input" id="rs-par">${parishOptions('St. Andrew')}</select></div><div class="field"><label for="rs-type">I am a</label><select class="input" id="rs-type"><option>Family member</option><option>Provider</option><option>Caregiver</option></select></div></div><span class="hint">We’ll email the resource and our monthly tips. This adds you to the customer list.</span></div><div class="modal-foot"><button class="btn btn-primary">${ic('mail')} Email it to me</button></div></form>`)}

// ---------- Events ----------
const labels=['','Poor','Fair','Good','Very good','Excellent'];
document.addEventListener('click',e=>{
 const g=e.target.closest('[data-go]');if(g){location.hash=g.dataset.go;return}
 const tEl=e.target.closest('[data-toast]');if(tEl){e.preventDefault();toast(tEl.dataset.toast);return}
 const a=e.target.closest('[data-act]');if(!a)return;const d=a.dataset,act=d.act;
 if(act==='close-modal'){if(e.target===a||a.tagName==='BUTTON'){e.preventDefault();closeModal()}return}
 if(act==='noop'||act==='lead-status')return;
 if(a.tagName==='BUTTON'&&a.type!=='submit')e.preventDefault();
 const go=r=>{location.hash=r};
 switch(act){
  case'menu':document.getElementById('site-nav').classList.toggle('open');break;
  case'theme':document.documentElement.dataset.theme=isDark()?'light':'dark';render(true);break;
  case'req-toggle':document.body.classList.toggle('hide-req');toast(document.body.classList.contains('hide-req')?'Change tags hidden':'Showing the features you asked for');break;
  case'signup':openSignup(d.role||'family',d.msg,d.plan);break;
  case'signup-role':openSignup(d.role);break;
  case'svc':state.f.service=d.svc;go('search');if(route()==='search')render();break;
  case'expand-svc':{const gr=document.getElementById('svc-grid');gr.classList.toggle('expanded');a.textContent=gr.classList.contains('expanded')?'Show fewer':'Show all 28 services';break}
  case'save':state.saved[d.pid]=!state.saved[d.pid];toast(state.saved[d.pid]?'Saved to your account':'Removed from saved');render(true);break;
  case'request':state.req.step=1;if(d.svc)state.req.service=d.svc;go('request');break;
  case'rvf':state.rvFilter=d.k;render(true);break;
  case'helpful':state.helped[d.id]=!state.helped[d.id];render(true);break;
  case'write-review':openReview(d.target);break;
  case'pick':{state.rv.rating=+d.v;document.querySelectorAll('#picker button').forEach(b=>b.classList.toggle('on',+b.dataset.v<=state.rv.rating));document.getElementById('pick-label').textContent=labels[state.rv.rating];break}
  case'rm-media':state.draft.splice(+d.i,1);document.getElementById('previews').innerHTML=previews();break;
  case'chip':a.classList.toggle('on');break;
  case'match':openMatch(d.cg);break;
  case'cg-avail':state.tabs.cgAvail=d.k;render(true);break;
  case'avail':state.avail[d.i][d.j]=!state.avail[d.i][d.j];a.classList.toggle('on');break;
  case'req-opt':state.req[d.k]=d.v;render(true);break;
  case'req-back':state.req.step--;render();break;
  case'req-next':{const q=state.req;if(q.step===3){if(!q.name||!q.phone||!q.consent){document.getElementById('rq-err').hidden=false;return}q.step=4;go('request-done');return}q.step++;render();break}
  case'req-reset':state.req.step=1;go('request');break;
  case'cur':state.cur=d.v;render(true);break;
  case'cycle':state.yearly=d.v==='1';render(true);break;
  case'resource':openResource(+d.i);break;
  case'install':toast('In the live version this adds an app icon to the home screen.');break;
  case'dismiss-install':state.install=false;document.getElementById('install').remove();document.body.classList.remove('has-install');break;
  case'tab':state.tabs[d.key]=d.k;render(true);break;
  case'lead':openLead(d.id);break;
  case'copy':navigator.clipboard?.writeText(d.v).then(()=>toast('Copied '+d.v),()=>toast(d.v));break;
  case'cgm':state.matchesCG[d.id]=d.v;toast(d.v==='Accepted'?'Accepted. The family has been notified.':'Declined.');render(true);break;
  case'rate-client':openRateClient(d.name,d.k);break;
  case'review-prov':openProvReview(d.id);break;
  case'decide':{if(d.v==='ask'){closeModal();toast('Email sent asking for the missing document.');break}state.mod['prov-'+d.id]=d.v;closeModal();toast(d.v==='Active'?'Approved. The profile is now live and the provider was emailed.':'Application rejected. The provider was emailed.');render(true);break}
  case'mod':state.mod['rv-'+d.id]=d.v;toast('Review '+d.v.toLowerCase()+'.');render(true);break;
  case'sw':{const on=!a.classList.contains('on');state.catalog[d.k]=on;a.classList.toggle('on',on);a.setAttribute('aria-checked',on);toast(on?'Switched on':'Switched off');break}
  case'parish-mode':{const cur=state.parishMode[d.p]||(LIVE.includes(d.p)?'Live':'Soon');state.parishMode[d.p]=cur==='Live'?'Soon':'Live';toast(d.p+(cur==='Live'?' set to coming soon':' is now live'));render(true);break}
  case'export':toast('Exported 1,284 contacts to CSV.');break;
 }
});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;
 if(d.filter){state.f[d.filter]=t.type==='checkbox'?t.checked:d.filter==='minRating'?+t.value:t.value;render(true);return}
 if(d.req){state.req[d.req]=t.type==='checkbox'?t.checked:t.value;return}
 if(d.act==='lead-status'){state.leadStatus[d.id]=t.value;toast('Status updated');return}
 if(t.id==='rv-files'){[...t.files].slice(0,6).forEach(f=>{const isV=f.type.startsWith('video');if(isV){state.draft.push({t:'video',h:200,d:'Video'});document.getElementById('previews').innerHTML=previews();return}const rd=new FileReader();rd.onload=()=>{state.draft.push({t:'img',src:rd.result});document.getElementById('previews').innerHTML=previews()};rd.readAsDataURL(f)});t.value=''}
});
document.addEventListener('input',e=>{const d=e.target.dataset;if(d.req&&e.target.type!=='checkbox')state.req[d.req]=e.target.value});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,k=f.dataset.form;
 if(k==='hero-search'){state.f.service=f.service.value;state.f.parish=f.parish.value;location.hash='search';return}
 if(k==='signup'){closeModal();toast(f.dataset.role==='provider'?'Account created. Upload your documents to get verified.':'Welcome to CareConnect! Your free account is ready.');return}
 if(k==='review'){if(!state.rv.rating){document.getElementById('rv-err').hidden=false;return}const [kind,id]=state.rv.target.split(':');const r={id:'u'+Date.now(),by:'You (Tanya M.)',parish:'St. Andrew',rating:state.rv.rating,date:'Just now',title:document.getElementById('rv-title').value||labels[state.rv.rating],text:document.getElementById('rv-text').value||'Great service.',media:state.draft.slice(),helpful:0,isNew:1,svc:kind==='p'?document.getElementById('rv-svc').value:''};
  (state.extra[id]=state.extra[id]||[]).unshift(r);state.draft=[];closeModal();state.rvFilter='all';toast('Review posted. Thank you for helping other families.');
  const dest=kind==='p'?'provider-'+id:'caregiver-'+id;if(route()!==dest)location.hash=dest;else render(true);setTimeout(()=>document.getElementById('reviews')?.scrollIntoView({behavior:'smooth'}),60);return}
 if(k==='rate-client'){if(!state.rv.rating){document.getElementById('rv-err').hidden=false;return}state.prov['cr'+state.rv.k]=state.rv.rating;closeModal();toast('Thanks. Your review of the family was saved.');render(true);return}
 if(k==='match'){const o=document.getElementById('match-out');o.innerHTML=matchOut();o.hidden=false;o.scrollIntoView({behavior:'smooth',block:'nearest'});return}
 if(k==='reply'){const v=f.querySelector('textarea').value.trim();if(!v)return;state.prov['rep'+f.dataset.k]=v;toast('Reply posted publicly.');render(true);return}
 if(k==='quick-request'){toast('Request sent. Blue Mountain usually replies within 1 hour.');f.reset();return}
 if(k==='resource'){closeModal();toast('Sent! Check your inbox.');return}
 if(k==='newsletter'||k==='waitlist'){f.reset();toast(k==='waitlist'?'You’re on the list. We’ll email you at launch.':'Subscribed. Tips arrive monthly.');return}
});
addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
document.body.classList.add('hide-req');
render();

</script>
</body></html>
